[project]
name = "drbader-api"
version = "0.1.0"
description = "Medical consulting marketplace API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.1.0",
  "python-multipart>=0.0.9",
  "pydantic[email]>=2.6.0",
  "prisma>=0.11.0",
  "boto3>=1.34.0",
  "aiofiles>=23.2.1",
  "httpx>=0.26.0",
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.5",
  "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--maxfail=1 --disable-warnings --cov=app --cov-report=term-missing"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
